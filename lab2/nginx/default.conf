upstream app_upstream {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # DNS Docker'а: имена сервисов резолвятся при запросе, а не при старте,
    # поэтому nginx стартует и без опционального adminer
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Проверка живости самого nginx (для healthcheck)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Опциональный adminer (профиль tools). Если он не запущен — 502.
    location /adminer/ {
        set $adminer_upstream adminer:8080;
        proxy_pass http://$adminer_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное — в Spring Boot приложение
    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
